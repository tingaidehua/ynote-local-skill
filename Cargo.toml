[package]
name = "ynote-cli"
version = "0.4.1"
edition = "2024"
description = "Local-first CLI, mirror database, synchronizer and web UI for Youdao Note"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
libloading = "0.8"
mime_guess = "2.0"
notify = { version = "8.2", default-features = false }
pathdiff = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
lto = false
codegen-units = 8
strip = true
